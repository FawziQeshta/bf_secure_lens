name: bf_secure_lens
description: "BF SecureLens - App Security Auditor & Advisory Tool"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.1.1
  path: ^1.9.1
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  equatable: ^2.1.0
  get_it: ^9.2.1
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon_app.png"
  windows:
    generate: true
    image_path: "assets/images/icon_app.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
